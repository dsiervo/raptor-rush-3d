name: Apply Pteranodon visibility QA

on:
  push:
    branches:
      - gameplay-readability-audit
    paths:
      - .ptero-visibility-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: gameplay-readability-audit
          fetch-depth: 0

      - name: Add pixel visibility regression test
        run: python3 scripts/add-pteranodon-visibility-qa.py

      - name: Commit visibility QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ptero-visibility-ready
          rm -f scripts/add-pteranodon-visibility-qa.py
          rm -f .github/workflows/apply-pteranodon-visibility-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add pixel-level Pteranodon visibility regression test"
          git push origin HEAD:gameplay-readability-audit
