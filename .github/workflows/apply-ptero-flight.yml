name: Apply dedicated pteranodon flight animation

on:
  push:
    branches:
      - phase2-visual-fix
    paths:
      - .ptero-flight-ready

permissions:
  contents: write

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v6
        with:
          ref: phase2-visual-fix
          fetch-depth: 0

      - name: Integrate dedicated flight frames
        run: |
          python3 scripts/apply-ptero-flight.py
          node --check game.js

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run complete mobile visual QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/phase2-flight-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node qa/phase2-test.js

      - name: Upload final QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-flight-mobile-qa
          path: |
            qa/phase2-mobile.png
            qa/phase2-report.json
            /tmp/phase2-flight-http.log

      - name: Commit tested flight release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ptero-flight-ready .phase2-ready
          rm -f scripts/apply-ptero-flight.py .github/workflows/apply-ptero-flight.yml
          rm -rf node_modules package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Phase 2 with dedicated airborne pteranodon animation'
          git push origin HEAD:phase2-visual-fix
