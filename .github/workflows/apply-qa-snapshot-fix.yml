name: Apply clean QA snapshot patch

on:
  push:
    branches:
      - gameplay-readability-audit
    paths:
      - .qa-snapshot-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: gameplay-readability-audit
          fetch-depth: 0

      - name: Patch screenshot capture
        run: python3 scripts/fix-qa-snapshots.py

      - name: Commit clean evidence setup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .qa-snapshot-ready
          rm -f scripts/fix-qa-snapshots.py
          rm -f .github/workflows/apply-qa-snapshot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture unobstructed gameplay QA screenshots"
          git push origin HEAD:gameplay-readability-audit
