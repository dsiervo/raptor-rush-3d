name: Apply final Pteranodon altitude

on:
  push:
    branches:
      - gameplay-readability-audit
    paths:
      - .ptero-altitude-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: gameplay-readability-audit
          fetch-depth: 0

      - name: Raise Pteranodon and validate
        run: |
          python3 scripts/raise-pteranodon.py
          node --check game.js
          grep -q "readability3" index.html
          grep -q "lift=135+p.laneWidth\*1.18" game.js

      - name: Commit final altitude correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ptero-altitude-ready
          rm -f scripts/raise-pteranodon.py
          rm -f .github/workflows/apply-final-pteranodon-altitude.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Raise Pteranodon above the raptor head line"
          git push origin HEAD:gameplay-readability-audit
