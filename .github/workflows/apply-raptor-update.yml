name: Apply Raptor Rush gameplay update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-raptor-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild verified update
        shell: bash
        run: |
          cat .raptor-update/part-* > /tmp/raptor-update.b64
          base64 --decode /tmp/raptor-update.b64 > /tmp/raptor-update.tar.gz
          echo "05a0aff34c729a21c4e0d33fa8c3cbc49baec086d977435e0ad3d16d54346526  /tmp/raptor-update.tar.gz" | sha256sum --check -
          tar -xzf /tmp/raptor-update.tar.gz -C .
          rm -rf .raptor-update

      - name: Commit gameplay update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add guided tutorial, lives, desert goal, and new hazards"
          git push origin HEAD:main
