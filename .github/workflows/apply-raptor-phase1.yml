name: Apply Phase 1 raptor animation

on:
  push:
    branches: [main]
    paths: [.phase1-ready]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble and integrate player animation
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .phase1/atlas/part-*.txt | base64 --decode > assets/raptor-player.avif
          echo "9074bedddbf257a44bf048b6a8b7d27eaf5ca2a254e9beaa979e3373fd2dc533  assets/raptor-player.avif" | sha256sum -c -
          python3 .phase1/apply.py
          node --check game.js

      - name: Test on mobile viewport with Playwright
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8000 >/tmp/raptor-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .phase1/phase1-test.js | tee phase1-qa.json
          mkdir -p qa
          cp /tmp/phase1-mobile.png qa/phase1-mobile.png

      - name: Commit tested Phase 1 release
        id: release
        run: |
          set -euo pipefail
          rm -rf .phase1 .phase1-ready .github/workflows/apply-raptor-phase1.yml node_modules package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Phase 1 rear-view raptor animation"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployed commit
        run: |
          set -euo pipefail
          echo "${{ steps.release.outputs.sha }}" > .pages-deployed
          git add .pages-deployed
          git commit -m "Record Phase 1 Pages deployment"
          git push origin HEAD:main
