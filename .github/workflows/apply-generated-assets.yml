name: Apply generated dinosaur assets

on:
  push:
    branches:
      - asset-release-20260801
    paths:
      - .release-ready

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: asset-release-20260801
          fetch-depth: 0

      - name: Assemble optimized game atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .release/atlas/part-*.txt | base64 --decode > assets/game-atlas.webp
          cp .release/index.html index.html
          cp .release/style.css style.css
          cp .release/game.js game.js
          test -s assets/game-atlas.webp
          rm -rf .release .release-ready .github/workflows/apply-generated-assets.yml

      - name: Commit assembled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish generated dinosaur asset release"
          git push origin HEAD:asset-release-20260801
