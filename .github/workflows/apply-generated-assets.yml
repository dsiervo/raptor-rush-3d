name: Apply generated 3D asset upgrade

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_generated_asset_upgrade.py'
      - 'hd-procedural.css'
      - '.github/workflows/apply-generated-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generated-3d-upgrade
  cancel-in-progress: false

jobs:
  upgrade-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Integrate generated asset designs
        run: python3 tools/apply_generated_asset_upgrade.py

      - name: Validate JavaScript syntax
        run: |
          cat game-1.js game-2.js game-3.js > /tmp/raptor-game.js
          node --check /tmp/raptor-game.js

      - name: Commit integrated 3D source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html game-1.js game-3.js
          git diff --cached --quiet || git commit -m "Integrate generated 3D dinosaur assets"
          git push

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Mobile Playwright smoke test
        run: |
          python3 -m http.server 4173 > /tmp/raptor-http.log 2>&1 &
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.click('#start-btn');
          await page.waitForTimeout(900);
          const state=await page.evaluate(()=>window.__RAPTOR_GAME__?.state);
          if(state!=='running') throw new Error(`Unexpected game state: ${state}`);
          await page.evaluate(()=>{ window.__RAPTOR_GAME__.clearHazards(); window.__RAPTOR_GAME__.forceObstacle('ptero'); });
          await page.waitForTimeout(300);
          await page.screenshot({path:'playwright-hd-mobile.png'});
          if(errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          EOF
          node smoke.mjs
          rm smoke.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployed revision
        run: |
          git pull --rebase
          echo "$(git rev-parse HEAD)" > .pages-deployed
          git add .pages-deployed
          git diff --cached --quiet || git commit -m "Record generated 3D Pages deployment"
          git push
