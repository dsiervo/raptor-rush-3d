name: Final gameplay branch QA

on:
  push:
    branches:
      - gameplay-readability-audit
    paths:
      - .final-qa-ready

permissions:
  contents: read

jobs:
  full-mobile-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch revision
        uses: actions/checkout@v6
        with:
          ref: gameplay-readability-audit

      - name: Validate production JavaScript
        run: |
          node --check game.js
          node --check assets/ptero-sheet-part-0.js
          node --check assets/ptero-sheet-part-1.js
          node --check assets/ptero-sheet-part-2.js
          node --check assets/ptero-sheet-part-3.js

      - name: Prepare unobstructed screenshot captures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename, expected in [('qa/gameplay-readability-test.js', 3), ('qa/phase2-test.js', 2)]:
              path = Path(filename)
              text = path.read_text()
              old = "await page.evaluate(() => window.__RAPTOR_GAME__.pause());"
              new = "await page.evaluate(() => { window.__RAPTOR_GAME__.pause(); document.getElementById('pause').classList.remove('visible'); });"
              if text.count(old) != expected:
                  raise SystemExit(f'{filename}: expected {expected} screenshot freezes, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run both mobile gameplay suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/final-game-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node qa/gameplay-readability-test.js
          node qa/phase2-test.js

      - name: Upload final visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-gameplay-evidence
          path: |
            qa/readability-jump-obstacles.png
            qa/readability-side-hazards.png
            qa/readability-pteranodon.png
            qa/gameplay-readability-report.json
            qa/phase2-mobile.png
            qa/phase2-report.json
            /tmp/final-game-http.log
